name: harness-ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: uv sync --group dev
      - name: Run unit and non-Blender tests
        run: uv run pytest -q
      - name: Compile Python modules
        run: uv run python -m compileall -q src evaluator blender scripts training
      - name: Validate benchmark prompt index
        run: uv run python scripts/validate_benchmark_prompt_index.py --root dataset/vbench2-agent-training-index-v1
      - name: Check path portability
        run: uv run python scripts/check_repo_portability.py
