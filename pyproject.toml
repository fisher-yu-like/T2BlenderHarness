[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-blender-proxy-harness"
version = "0.1.0"
description = "Deterministic contracts and orchestration for text-to-Blender proxy evaluation"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0,<3.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
